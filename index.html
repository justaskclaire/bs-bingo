<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Survival Bingo</title>
<meta name="description" content="Smile for the photos. Mark the card. It's not about the tablecloth.">
<meta property="og:title" content="Wedding Survival Bingo">
<meta property="og:description" content="Smile for the photos. Mark the card. It's not about the tablecloth.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
  /* Southwest palette: terra cotta + turquoise, with sage, deep blue and sunset gold */
  :root {
    --bg: #f5e6d0;
    --card: #fffaf2;
    --ink: #3d2417;
    --muted: #86634e;
    --line: #3d2417;
    --mark: #b8492a;
    --mark-ink: #ffffff;
    --win: #e9a53b;
    --free: #3fb3a8;
    --turquoise: #1f8a80;
    --sage: #7c9a5e;
    --blue: #2f5d8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  h1 {
    margin: 2px 0 6px;
    font-family: "Rye", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 11vw, 3.6rem);
    letter-spacing: 0.06em;
    line-height: 1;
  }
  /* little southwest zigzag under the tagline */
  .band {
    width: 100%;
    max-width: 560px;
    height: 10px;
    margin: 0 0 18px;
    background:
      linear-gradient(135deg, var(--mark) 25%, transparent 25%) -10px 0 / 20px 10px repeat-x,
      linear-gradient(225deg, var(--mark) 25%, transparent 25%) -10px 0 / 20px 10px repeat-x,
      linear-gradient(315deg, var(--free) 25%, transparent 25%) 0 0 / 20px 10px repeat-x,
      linear-gradient(45deg, var(--free) 25%, transparent 25%) 0 0 / 20px 10px repeat-x;
  }
  .eyebrow {
    margin: 0;
    color: var(--mark);
    font-weight: 800;
    font-size: clamp(0.85rem, 3.5vw, 1rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .sub { margin: 0 0 14px; color: var(--muted); text-align: center; }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 16px;
    box-shadow: 6px 6px 0 var(--line);
    padding: 10px;
  }
  .letters, .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .letters div {
    text-align: center;
    font-family: "Rye", Georgia, serif;
    font-size: clamp(1.3rem, 6vw, 1.9rem);
    padding: 4px 0 6px;
  }
  /* B I N G O alternate through the wedding colors */
  .letters div:nth-child(1) { color: var(--mark); }
  .letters div:nth-child(2) { color: var(--turquoise); }
  .letters div:nth-child(3) { color: #c4861c; }
  .letters div:nth-child(4) { color: var(--sage); }
  .letters div:nth-child(5) { color: var(--blue); }
  .cell {
    aspect-ratio: 1;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 15px; /* starting size; fitText() shrinks per square */
    line-height: 1.12;
    padding: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    hyphens: manual; /* only break at the \u00AD marks in SQUARES */
    -webkit-hyphens: manual;
    transition: transform 0.08s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    /* no text selection / iOS callout menu while long-pressing */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    position: relative;
    z-index: 0;
    overflow: hidden;
  }
  .cell:active { transform: scale(0.95); }
  .cell.free { background: var(--free); font-weight: 800; cursor: default; }
  .cell.breaky { overflow-wrap: anywhere; }
  .cell.nohyph { hyphens: none; -webkit-hyphens: none; }
  /* phones: tighter spacing and taller squares, so long phrases stay readable */
  @media (max-width: 520px) {
    body { padding-left: 10px; padding-right: 10px; }
    .card { padding: 5px; border-radius: 12px; box-shadow: 4px 4px 0 var(--line); }
    .letters, .grid { gap: 3px; }
    .cell { aspect-ratio: 4 / 5; padding: 2px; border-width: 1.5px; border-radius: 7px; }
  }
  .cell.marked { background: var(--mark); color: var(--mark-ink); }
  .cell.win { box-shadow: inset 0 0 0 4px var(--win); }
  /* fill that sweeps across while holding to uncheck */
  .cell.holding::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--card);
    transform-origin: left;
    animation: hold var(--hold-ms) linear forwards;
  }
  .cell.holding { color: var(--ink); }
  @keyframes hold { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .cell.nudge { animation: nudge 0.3s; }
  @keyframes nudge {
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .hint {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    transition: color 0.2s;
  }
  .hint.flash { color: var(--mark); font-weight: 700; }
  .status {
    min-height: 2em;
    margin: 18px 0 8px;
    font-size: 1.1rem;
    text-wrap: balance;
    font-weight: 800;
    text-align: center;
  }
  button.reset {
    font: inherit;
    background: none;
    border: 2px solid var(--muted);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 16px;
    cursor: pointer;
  }
  .confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>
  <p class="eyebrow">Wedding Survival</p>
  <h1>BINGO</h1>
  <p class="sub">Smile for the photos. Mark the card.<br>It's not about the tablecloth.</p>
  <div class="band" aria-hidden="true"></div>

  <div class="card">
    <div class="letters"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <p class="hint" id="hint">Tap to check · press &amp; hold to uncheck</p>

  <div class="status" id="status"></div>
  <button class="reset" id="reset">Reset card</button>

<script>
  // ✏️ Edit these! 24 squares, in reading order (left→right, top→bottom).
  // The center square is the FREE space and gets inserted automatically.
  // \u00AD is an invisible "break here if needed" hyphen for long words on small phones.
  const SQUARES = [
    // row 1
    "Someone asks about babies",
    "Barbara's tablecloth meltdown",
    "Drunk Grooms\u00ADman",
    "“I'm autistic too, actually!”",
    "Cold catered food",
    // row 2
    "Caree is over\u00ADstimulated",
    "Vaguely racist Mexican comment",
    "Barbara frowns at a sweet moment",
    "Checked Out Groom ™️",
    "A brat goes for the cake early",
    // row 3 (FREE goes in the middle)
    "Barbara mad about the guest list",
    "Weird Autism Mom comment",
    "Someone whispers “Mexican”",
    "Bride freaks out about scheduling",
    // row 4
    "Miss the champagne for brat duty",
    "Drunk Brides\u00ADmaid",
    "Brent talks shit about DIL's fam",
    "“Wait, one more picture!”",
    "Barbara hijacks convo to lecture",
    // row 5
    "The Young\u00ADman Eyeroll",
    "Cost of something mentioned",
    "Caree says “fuck” near an 80yo",
    "Autism question → podcast factoid",
    "“We see the grandkids ALL the time!”",
  ];
  const FREE_TEXT = "PASSIVE AGGRES\u00ADSIVE FREE SPACE";
  const STORAGE_KEY = "wedding-bingo-v1";

  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");

  const cells = [...SQUARES.slice(0, 12), null, ...SQUARES.slice(12, 24)];

  let marked = new Set([12]);
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    saved.forEach(i => marked.add(i));
  } catch {}

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...marked])); } catch {}
  }

  const LINES = [];
  for (let i = 0; i < 5; i++) {
    LINES.push([0,1,2,3,4].map(j => i * 5 + j)); // rows
    LINES.push([0,1,2,3,4].map(j => j * 5 + i)); // cols
  }
  LINES.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);

  // How long you have to hold a checked square to uncheck it.
  const HOLD_MS = 600;
  document.documentElement.style.setProperty("--hold-ms", HOLD_MS + "ms");

  const hintEl = document.getElementById("hint");
  let hintTimer;
  function flashHint() {
    hintEl.classList.add("flash");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hintEl.classList.remove("flash"), 1200);
  }

  // Build the buttons once; render() only updates their classes.
  const buttons = cells.map((text, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    grid.appendChild(b);
    if (text === null) {
      b.classList.add("free");
      b.innerHTML = "<span></span>";
      b.firstChild.textContent = FREE_TEXT;
      return b;
    }
    b.innerHTML = "<span></span>";
    b.firstChild.textContent = text;

    let holdTimer = null;
    let heldOff = false; // true if this press just unchecked via long-press

    const cancelHold = () => {
      clearTimeout(holdTimer);
      holdTimer = null;
      b.classList.remove("holding");
    };

    b.addEventListener("pointerdown", () => {
      heldOff = false;
      if (!marked.has(i)) return;
      b.classList.add("holding");
      holdTimer = setTimeout(() => {
        cancelHold();
        heldOff = true;
        marked.delete(i);
        if (navigator.vibrate) navigator.vibrate(30);
        save();
        render();
      }, HOLD_MS);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, cancelHold));
    b.addEventListener("contextmenu", e => e.preventDefault());

    b.addEventListener("click", () => {
      if (heldOff) { heldOff = false; return; }
      if (marked.has(i)) {
        // Quick tap on a checked square: don't uncheck, just remind.
        b.classList.remove("nudge");
        void b.offsetWidth;
        b.classList.add("nudge");
        flashHint();
        return;
      }
      marked.add(i);
      save();
      render();
    });
    return b;
  });

  // Shrink each square's text until it fits, so long phrases work on phones.
  // Words are kept whole when possible; hyphenation is only used when keeping
  // words whole would make the text noticeably smaller.
  function fitSize(b, span, room, roomH) {
    let size = 15;
    const set = () => (b.style.fontSize = size + "px");
    set();
    // Shrink for long words only down to 9px; past that, the word has to break.
    while (size > 9 && span.scrollWidth > room) { size -= 0.5; set(); }
    const wordsFit = span.scrollWidth <= room;
    if (!wordsFit) b.classList.add("breaky");
    while (size > 7 && span.offsetHeight > roomH) { size -= 0.5; set(); }
    return { size, wordsFit };
  }

  function fitText() {
    buttons.forEach(b => {
      const span = b.querySelector("span");
      if (!span) return;
      const pad = parseFloat(getComputedStyle(b).paddingLeft) * 2;
      const room = b.clientWidth - pad, roomH = b.clientHeight - pad;

      b.classList.remove("breaky");
      b.classList.add("nohyph");
      const whole = fitSize(b, span, room, roomH);

      b.classList.remove("breaky", "nohyph");
      const hyph = fitSize(b, span, room, roomH);

      // Prefer whole words when they're still comfortably readable,
      // or when hyphenating wouldn't make the text much bigger anyway.
      if (whole.wordsFit && (whole.size >= 11.5 || (whole.size >= 10 && whole.size >= hyph.size - 1))) {
        b.classList.remove("breaky");
        b.classList.add("nohyph");
        b.style.fontSize = whole.size + "px";
      }
    });
  }
  window.addEventListener("resize", fitText);
  if (document.fonts) document.fonts.ready.then(fitText);

  let prevWins = -1;

  function render() {
    const winning = LINES.filter(l => l.every(i => marked.has(i)));
    const winCells = new Set(winning.flat());

    buttons.forEach((b, i) => {
      if (cells[i] !== null) b.classList.toggle("marked", marked.has(i));
      b.classList.toggle("win", winCells.has(i));
    });

    if (marked.size === 25) statusEl.textContent = "🏆 BLACKOUT. You survived the wedding.";
    else if (winning.length > 1) statusEl.textContent = `🍾 ${winning.length}× BINGO! Someone get Caree a refill.`;
    else if (winning.length === 1) statusEl.textContent = "🥂 BINGO! Go find that champagne.";
    else statusEl.textContent = "";

    if (prevWins !== -1 && winning.length > prevWins) confetti();
    prevWins = winning.length;
  }

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("Clear the whole card and start fresh?")) return;
    marked = new Set([12]);
    save();
    render();
  });

  function confetti() {
    const colors = ["#b8492a", "#3fb3a8", "#e9a53b", "#7c9a5e", "#2f5d8a", "#e07a3f"];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 1.5 + Math.random() * 1.5 + "s";
      c.style.animationDelay = Math.random() * 0.3 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }

  fitText();
  render();
</script>
</body>
</html>
